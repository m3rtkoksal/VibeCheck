name: VibeCheck
options:
  minimumXcodeGenVersion: 2.45.0
configs:
  Debug: debug
  Release: release
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.12.1
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: 4.5.0
targets:
  VibeCheck:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: VibeCheck/AppInfo.plist
      properties:
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.sr90052857.vibecheck.firebase
            CFBundleURLSchemes:
              - app-1-715916553317-ios-035156a2950e1087986a8c
    sources:
      - path: VibeCheck
    entitlements:
      path: VibeCheck/VibeCheck.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sr90052857.vibecheck
        PRODUCT_NAME: VibeCheck
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        INFOPLIST_KEY_CFBundleDisplayName: VibeCheck
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7T2589WH6H
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseFirestore
      - package: Lottie
        product: Lottie
